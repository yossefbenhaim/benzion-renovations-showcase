server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Redirects stay relative, so they keep the https host Traefik received.
  absolute_redirect off;
  port_in_redirect off;
  server_tokens off;

  include /etc/nginx/snippets/security.conf;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/xml application/javascript text/javascript application/json
             application/ld+json application/manifest+json image/svg+xml;

  # Hashed build assets: cache forever.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security.conf;
    try_files $uri =404;
  }

  # SPA: unknown paths fall back to index.html; HTML always revalidates.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security.conf;
    try_files $uri $uri/ /index.html;
  }
}
