# Security headers, included in the server block and in every location that sets its own headers
# (a location with any add_header drops the server-level ones).
# CSP hosts, by what uses them:
#   GTM + GA4 (index.html inline loaders)      *.googletagmanager.com, *.google-analytics.com, *.analytics.google.com
#   Google Fonts (index.html)                   fonts.googleapis.com (CSS), fonts.gstatic.com (font files)
#   Contact form (EmailJS)                      api.emailjs.com
#   Contact map (Leaflet)                       *.tile.openstreetmap.org tiles, cdnjs.cloudflare.com marker icons
#   Project photos + hero videos                pub-d7c4843b98b94259a1425e5b4956ce0b.r2.dev
#   Parallax background                         images.unsplash.com
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://pub-d7c4843b98b94259a1425e5b4956ce0b.r2.dev https://images.unsplash.com https://*.tile.openstreetmap.org https://cdnjs.cloudflare.com https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: https://pub-d7c4843b98b94259a1425e5b4956ce0b.r2.dev; connect-src 'self' https://api.emailjs.com https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; frame-src https://www.googletagmanager.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
